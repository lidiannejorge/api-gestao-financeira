  services:
    db-usuarios:
      image: postgres:17
      container_name: db-usuarios
      environment:
        POSTGRES_DB: ${USER_DB_NAME}
        POSTGRES_USER: ${USER_DB_USER}
        POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      ports:
        - "5433:5432"
      volumes:
        - usuarios_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    db-transacoes:
      image: postgres:17
      container_name: db-transacoes
      environment:
        POSTGRES_DB: ${TRANSACTION_DB_NAME}
        POSTGRES_USER: ${TRANSACTION_DB_USER}
        POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      ports:
        - "5434:5432"
      volumes:
        - transacoes_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${TRANSACTION_DB_USER} -d ${TRANSACTION_DB_NAME}"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

    api-usuarios:
      image: api-usuario
      build:
        context: ./ms1-usuario
        dockerfile: Dockerfile
      container_name: api-usuarios
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuarios:5432/${USER_DB_NAME}
        SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
        SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
        SERVER_PORT: 8080
      ports:
        - "5001:8080"
      depends_on:
        db-usuarios:
          condition: service_healthy
      restart: unless-stopped

    api-transacoes:
      image: api-transacoes
      build:
        context: ./ms2-transacoes
        dockerfile: Dockerfile
      container_name: api-transacoes
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db-transacoes:5432/${TRANSACTION_DB_NAME}
        SPRING_DATASOURCE_USERNAME: ${TRANSACTION_DB_USER}
        SPRING_DATASOURCE_PASSWORD: ${TRANSACTION_DB_PASSWORD}
        MS1_BASE_URL: http://api-usuarios:8080
        SERVER_PORT: 8080
      ports:
        - "5002:8080"
      depends_on:
        db-transacoes:
          condition: service_healthy
        api-usuarios:
          condition: service_started
      restart: unless-stopped

    pgadmin:
      image: dpage/pgadmin4:latest
      container_name: pgadmin
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      ports:
        - "5050:80"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
      depends_on:
        db-usuarios:
          condition: service_healthy
        db-transacoes:
          condition: service_healthy
      restart: unless-stopped

  volumes:
    usuarios_data:
    transacoes_data:
    pgadmin_data: