spring.application.name=ms2-transacoes
# Desabilita o Docker Compose automático do Spring
spring.docker.compose.enabled=false
# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/${TRANSACTION_DB_NAME}
spring.datasource.username=${TRANSACTION_DB_USER}
spring.datasource.password=${TRANSACTION_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuração JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Porta da API
server.port=8080
# Comunicação com MS1 - Usuários
ms1.base-url=${MS1_BASE_URL:http://localhost:5001}
# Comunicação com API Mock - Saldo e limites
mockapi.base-url=https://6ae90fdf1a7b15aaa50f9bc0.mockapi.io/api/v1
# Comunicação com a BrasilAPI - Câmbio
brasilapi.base-url=${BRASILAPI_BASE_URL:https://brasilapi.com.br}