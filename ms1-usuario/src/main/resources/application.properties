spring.application.name=ms1-usuarios
# Desabilita a integração automática com Docker Compose
spring.docker.compose.enabled=false
# PostgreSQL - Banco de usuários
spring.datasource.url=jdbc:postgresql://localhost:5433/${USER_DB_NAME}
spring.datasource.username=${USER_DB_USER}
spring.datasource.password=${USER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
